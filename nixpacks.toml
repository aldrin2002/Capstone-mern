# Nixpacks configuration to speed up Railway builds for CafeX
# Uses Node 20 and minimizes duplicate installs.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
dependsOn = ["setup"]
# Use ci for deterministic faster installs (requires committed package-lock.json files)
cmds = [
  "npm ci",
  "npm ci --prefix frontend"
]

[phases.build]
cmds = [
  "npm run build:frontend"
]

[phases.start]
cmd = "NODE_ENV=production node backend/index.js"

[variables]
# Prevent npm from generating audit/fund noise during build
NPM_CONFIG_FUND = "false"
NPM_CONFIG_AUDIT = "false"

[cache]
# Cache node_modules to speed subsequent builds (Railway may handle automatically)
paths = ["node_modules", "frontend/node_modules"]
